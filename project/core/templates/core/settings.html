{% extends "core/base.html" %}
{% load static %}
{% load widget_tweaks %}


{% block content %}
<div class="row">

  <div class="col-3">
    <div class="settings-menu">
      <div class="wrapper">
        <div class="title">Settings</div>
        <hr>
        <ul>
          <li class="{% block accountactiveclass %}{% endblock %}">
            <a href="{% url 'users:update' %}" role="button">Account</a>
          </li>
          <li class="{% block passwordactiveclass %}{% endblock %}">
            <a href="{% url 'users:change-password' %}" role="button">Password</a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <div class="col-6">
    {% block settings %}
    {% endblock %}
  </div>

</div>
{% endblock %}
