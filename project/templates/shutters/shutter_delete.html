{% extends "core/base.html" %}
{% load widget_tweaks %}
{% load static %}


{% block content %}
<div class="container wrapper">
  <div class="row">
    <div class="col-6 offset-3 section">
      <div class="section-wrapper textcenter">
        <form method="post">
          {% csrf_token %}
          <p>Are you sure you want to delete this item?</p>
          <input class="btn inline nf" type="submit" value="Confirm"> <!-- CONFIRM delete -->
        </form>
        <button class="btn inline nf">
          <a  href="{% url 'deals:deal-summary' object.deal_id %}">Cancel</a>
        </button> <!-- CANCEL and back to deal summary -->
      </div>
    </div>
  </div>
</div>
{% endblock %}
