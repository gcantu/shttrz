{% load humanize %}

<table id="price-table">
  <tbody>
    <tr>
      <th>Subtotal: </th>
      <td>
        <div>$ {{ price.subtotal|floatformat|intcomma }}</div>
      </td>
    </tr>

    <tr class="underline">
      <th>Tax: </th>
      <td>$ {{ price.tax|floatformat|intcomma }} </td>
    </tr>

    <tr class="table-total-row">
      <th>Total: </th>
      <td>$ {{ price.total|floatformat|intcomma }}</td>
    </tr>

    <tr class="underline">
      <th>Down Payment: </th>
      <td>$ {{ price.down_payment|floatformat|intcomma }}</td>
    </tr>

    <tr class="table-total-row">
      <th>Balance</th>
      <td>$ {{ price.balance|floatformat|intcomma }}</td>
    </tr>
  </tbody>
</table>
