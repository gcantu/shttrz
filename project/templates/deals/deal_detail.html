
<table id="deal-detail-table">
  <tbody>
    <tr>
      <th>Created Date: </th>
      <td>{{ deal.created_date.date }}</td>
    </tr>

    <tr>
      <th>Install Date: </th>
      <td>{{ deal.install_date }}</td>
    </tr>

    <tr>
      <th>Agent: </th>
      <td>{{ deal.agent.first_name }} {{ deal.agent.last_name }}</td>
    </tr>

    <tr>
      <th>Measured by: </th>
      <td>{{ deal.measured_by.first_name }} {{ deal.measured_by.last_name }}</td>
    </tr>
  </tbody>
</table>
