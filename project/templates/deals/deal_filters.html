{% load widget_tweaks %}

<div class="filter-section">
  <div class="title"><b>Filter By</b></div><br>
  <form action="" method="get">
      <div class="form-group">
        {{ filter.form.date_range.label_tag }}
        {% render_field  filter.form.date_range class="custom-select mr-sm-2" %}
      </div>
      <div class="form-group">
        {{ filter.form.status.label_tag }}
        {% render_field  filter.form.status class="custom-select mr-sm-2" %}
      </div>
    <input class="btn" type="submit" value="Submit"/>
  </form><br>

  <div style="margin-top:40px;">
    <a class="icon-btn" href="{% url 'dashboard:deal-list' 'Deleted' %}">
      <i class="fas fa-trash-alt"></i>
      &nbsp;Deleted Deals
    </a>
  </div>
</div>
