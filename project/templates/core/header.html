{% load static %}

<header class="noprint">
  <div class="container wrapper clearfix">
    <div class="row">

      <div class="col">
        <a class="home-btn" href="{% url 'core:home' %}"><i class="fas fa-home"></i></a>
      </div>

      <div class="col">
        <div id="header-logo">
          <img src="{% static 'img/shutterize_logo.png' %}" alt="Shutterize Software">
        </div> <!-- END logo -->

        <div id="header-text" class="heading-md">
          <a href="{% url 'core:home' %}" title="Shutterize" rel="home">Shutterize</a>
        </div> <!-- END title -->
      </div>

      <div class="col">
        <div id="header-user" class="dropdown rf">
          <a class="btn dropdown-toggle" href="#" role="button" id="dropdownMenuLink" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            <i class="fas fa-user-circle"></i>
            {{ request.user }}
          </a>

          <div class="dropdown-menu dropdown-menu-right" aria-labelledby="dropdownMenuLink">
            <a class="dropdown-item" href="{% url 'users:update' %}">Settings</a>
            <a class="dropdown-item" href="{% url 'users:logout' %}">Logout</a>
          </div>
        </div> <!-- END user menu -->
      </div>

    </div>
  </div>
</header>
